[package]
name = "r3-cert"
version = "0.1.0"
edition = "2024"
publish = false
description = "Epoch authorization certificate for batches of ML-DSA-87 signatures (round 3 design): prover, verifier, soundness tests, measurements"

# Standalone crate, not a member of ../Cargo.toml.
[workspace]
exclude = ["vendor"]

# Profile 0x00070001 needs one hook in p3-challenger 0.8.0 (DomainSeparator seeds are not
# absorbed by a challenger that declines them). See vendor/p3-challenger-0.8.0/R3-CERT-PATCH.txt.
[patch.crates-io]
p3-challenger = { path = "vendor/p3-challenger-0.8.0" }

[dependencies]
p3-whir = { version = "=0.8.0", features = ["parallel"] }
p3-field = "=0.8.0"
p3-goldilocks = "=0.8.0"
p3-security = "=0.8.0"
p3-sumcheck = "=0.8.0"
p3-challenger = "=0.8.0"
p3-commit = "=0.8.0"
p3-dft = "=0.8.0"
p3-matrix = "=0.8.0"
p3-merkle-tree = "=0.8.0"
p3-symmetric = "=0.8.0"
p3-multilinear-util = "=0.8.0"
p3-maybe-rayon = { version = "=0.8.0", features = ["parallel"] }
rayon = "=1.12.0"
sha3 = "=0.10.8"
keccak = "=0.1.6"
bincode = "=1.3.3"
serde = "1"
libcrux-ml-dsa = "=0.0.11"
libc = "=0.2.191"
tikv-jemallocator = "=0.6.1"

[features]
# Test-only hooks (dishonest-prover overrides, forced short pools, challenge injection, the
# UNSAFE verifier controls). Never part of a measurement or production-verifier build.
lab-hooks = []

[profile.release]
debug = 0
opt-level = 3
lto = "thin"
codegen-units = 16
